name: Deploy AAC Library to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against committed build artifacts
        run: |
          allowed="www/public/.gitignore
          www/public/llms.txt"
          extra="$(git ls-files www/public | grep -vFx "$allowed" || true)"
          if [ -n "$extra" ]; then
            echo "::error::Found tracked files under www/public/ that should be generated at build time, not committed:"
            echo "$extra"
            echo "Remove them with: git rm --cached <path>"
            exit 1
          fi

      - name: Build AAC metadata
        run: ./scripts/update-site.sh

      - name: Build static site
        run: pnpm --dir www build
        env:
          NEXT_PUBLIC_BASE_PATH: /icons

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
